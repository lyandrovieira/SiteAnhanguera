<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anhanguera-GO</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="estilo/style.css">
    <link rel="stylesheet" href="estilo/publicacoes.css">
    <link rel="stylesheet" href="estilo/media-query.css">
    <link rel="shortcut icon" href="imagens/brasao-anhanguera.png" type="image/x-icon">   
</head>
<body onresize="mudouTamanho()">
    <header>
        <h1>Bem-vindos a Anhanguera!</h1>
    </header>
    <span id="burguer" class="material-symbols-outlined" onclick="clickMenu()">menu</span>

    <div id="menu-container"></div>
    <script>
        fetch('menu.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-container').innerHTML = data;
            })
            .catch(error => console.error('Erro ao carregar menu: ', error));
    </script>
    
    <main>
        <a href="postagens/casa-da-celg.html">Histórico da Casa da CELG em Anhanguera-GO.</a>
    </main>
    <footer>
        Site criado por Lyandro Barbosa Vieira de Melo em 17/08/2024. Inaugarado em --/--/----.
    </footer>
    <script>
        function mudouTamanho() {
            if (window.innerWidth >= 694) {
                menu.style.display = 'block'
            } else {
                menu.style.display = 'none'
            }
        }
        function clickMenu() {
            if (menu.style.display == 'block') {
                menu.style.display = 'none'
            } else {
                menu.style.display = 'block'
            }
        }
    </script>
</body>
</html>
